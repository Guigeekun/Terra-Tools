services:
  terra-tools:
    container_name: terra-tools
    ports:
    volumes:
      # Map data directory as read-write
      - ./user-data:/app/user-data
      # Map scripts and local-input as read-only so the entrypoint can use them without baking them into the image
      - ./scripts:/app/scripts:ro
      - ./local-input:/app/local-input:ro
    restart: unless-stopped
